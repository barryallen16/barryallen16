name: Update Stats Cards

# Keeps the local pixel-art stat SVGs live without hosting a server.
# Also compacts static profile SVGs in assets/*.svg on first run.
on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install opentype.js
        working-directory: scripts
        run: npm ci --no-audit --no-fund

      - name: Regenerate stat cards and compact static SVGs
        working-directory: scripts
        run: node generate.mjs

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No stat changes."
          else
            git commit -m "chore: refresh and compact profile svg assets"
            git pull --rebase origin main
            git push
          fi
